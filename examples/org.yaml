---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-user
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  memberOf: [guests]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: guests
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Owns and operates the AI Delivery Portal.
spec:
  type: team
  children: []
---
# Deploys via register-deploy (Golden Path #2, MLflow-registered models) —
# maps 1:1 to ArgoCD's mlops-team tenant
# (infra/argocd/appproject-{dev,staging,prod}-mlops-team.yaml) and
# Kargo's mlops-team Warehouse/Stages (infra/kargo/).
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: mlops-team
  description: Registers and deploys MLflow-tracked models via Golden Path #2.
spec:
  type: team
  children: []
---
# Deploys via deploy-llm ("Serving LLM") — maps 1:1 to ArgoCD's
# llmops-team tenant
# (infra/argocd/appproject-{dev,staging,prod}-llmops-team.yaml) and
# Kargo's llmops-team Warehouse/Stages (infra/kargo/).
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: llmops-team
  description: Serves self-hosted LLMs via vLLM/KServe.
spec:
  type: team
  children: []

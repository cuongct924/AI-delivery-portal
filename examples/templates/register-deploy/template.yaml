apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: register-deploy
  title: "Register → Deploy (Golden Path #2)"
  description: >
    Runs the Evaluate Gate against a registered model version and, if it
    passes, opens a PR with the generated KServe InferenceService manifest —
    calling services/orchestration-api the whole way, no mock steps.
  tags:
    - mlops

spec:
  owner: user:guest
  type: service

  parameters:
    - title: Model to deploy
      required:
        - modelName
        - modelVersion
        - repoUrl
      properties:
        modelName:
          title: Model name
          type: string
          description: E.g. "fraud-detection"
        modelVersion:
          title: Version
          type: string
          description: E.g. "3" — the MLflow Model Registry version number
        repoUrl:
          title: Repository
          type: string
          description: >
            Target GitOps repo for the deploy manifest PR, in the format
            github.com?owner=<org>&repo=<repo> (same shape
            publish:github:pull-request expects). No RepoUrlPicker field
            extension is confirmed available in this repo's frontend, so
            this is a plain string field.

  steps:
    - id: policy-check
      name: "Run the Evaluate Gate"
      action: orchestration:policy-check
      input:
        modelName: ${{ parameters.modelName }}
        modelVersion: ${{ parameters.modelVersion }}

    - id: prepare-manifest
      name: "Render the InferenceService manifest"
      action: orchestration:prepare-deploy-manifest
      input:
        modelName: ${{ parameters.modelName }}
        modelVersion: ${{ parameters.modelVersion }}

    - id: publish-pr
      name: "Open the deploy PR"
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: deploy-${{ parameters.modelName }}-${{ parameters.modelVersion }}
        title: "Deploy ${{ parameters.modelName }}:${{ parameters.modelVersion }}"
        description: >
          Adds the KServe InferenceService manifest for
          **${{ parameters.modelName }}** version **${{ parameters.modelVersion }}**
          (Evaluate Gate passed). ArgoCD (infra/argocd/inference-services-app.yaml)
          watches this path with automated sync — merging this PR deploys
          the model, no manual `kubectl apply` needed (assumes
          scripts/setup-kserve-argocd-local.sh has been run).
        sourcePath: infra/inference-services
        targetPath: infra/inference-services

    - id: record-deploy
      name: "Record the deploy PR"
      action: orchestration:record-deploy
      input:
        modelName: ${{ parameters.modelName }}
        modelVersion: ${{ parameters.modelVersion }}
        prUrl: ${{ steps['publish-pr'].output.remoteUrl }}

  output:
    links:
      - title: View deploy pull request
        url: ${{ steps['publish-pr'].output.remoteUrl }}
    text:
      - title: Result
        content: |
          Evaluate Gate passed for **${{ parameters.modelName }}** version
          **${{ parameters.modelVersion }}** — deploy PR opened:
          ${{ steps['publish-pr'].output.remoteUrl }}

          It contains `infra/inference-services/${{ parameters.modelName }}/${{ parameters.modelVersion }}.yaml`.
          Once merged, ArgoCD (infra/argocd/README.md) picks it up
          automatically — by default within ~3 minutes, or run
          `argocd app sync inference-services` to sync immediately.

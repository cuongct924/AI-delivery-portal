apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: llm-draft-register
  title: "Draft/Ingest → Register (LLMOps Golden Path #1)"
  description: >
    Drafts a new prompt version, or ingests documents into a new RAG index
    version — calling services/orchestration-api the whole way, no mock
    steps. Neither is active yet; run "Evaluate → Deploy (LLMOps Golden
    Path #2)" next.
  tags:
    - llmops

spec:
  owner: user:guest
  type: service

  parameters:
    - title: What to draft
      required:
        - artifactKind
      properties:
        artifactKind:
          title: Artifact kind
          type: string
          enum: [prompt, rag-index]
          description: No default — choose explicitly which kind of artifact this run drafts.
        promptName:
          title: Persona key (artifactKind=prompt)
          type: string
          description: E.g. "mlops"
        personaTitle:
          title: Persona display name (artifactKind=prompt)
          type: string
          description: E.g. "MLOps Assistant"
        promptContent:
          title: System prompt content (artifactKind=prompt)
          type: string
        collectionName:
          title: Qdrant collection (artifactKind=rag-index)
          type: string
        sourcePaths:
          title: Source document paths (artifactKind=rag-index)
          type: array
          items:
            type: string
          description: Repo-relative paths, e.g. ["docs/playbook-ai-delivery-portal.md"].
        chunkSize:
          title: Chunk size in characters (artifactKind=rag-index)
          type: integer
          default: 800
        chunkOverlap:
          title: Chunk overlap in characters (artifactKind=rag-index)
          type: integer
          default: 100
      allOf:
        - if:
            properties:
              artifactKind:
                const: prompt
          then:
            required:
              - promptName
              - personaTitle
              - promptContent
        - if:
            properties:
              artifactKind:
                const: rag-index
          then:
            required:
              - collectionName
              - sourcePaths

  steps:
    - id: draft-prompt
      name: "Draft the prompt"
      action: orchestration:draft-prompt
      if: ${{ parameters.artifactKind === 'prompt' }}
      input:
        name: ${{ parameters.promptName }}
        persona: ${{ parameters.personaTitle }}
        content: ${{ parameters.promptContent }}

    - id: rag-ingest
      name: "Ingest the RAG index"
      action: orchestration:rag-ingest
      if: ${{ parameters.artifactKind === 'rag-index' }}
      input:
        collection: ${{ parameters.collectionName }}
        sourcePaths: ${{ parameters.sourcePaths }}
        chunkSize: ${{ parameters.chunkSize }}
        chunkOverlap: ${{ parameters.chunkOverlap }}

  output:
    text:
      - title: Result
        content: |
          {% if parameters.artifactKind === 'prompt' %}
          Drafted prompt **${{ parameters.promptName }}** version
          **${{ steps['draft-prompt'].output.version }}** — not active yet.

          Run "Evaluate → Deploy (LLMOps Golden Path #2)" with
          artifactKind=prompt, promptName=${{ parameters.promptName }},
          promptVersion=${{ steps['draft-prompt'].output.version }} to
          evaluate and activate it.
          {% else %}
          Ingested **${{ parameters.collectionName }}** as index version
          **${{ steps['rag-ingest'].output.indexVersion }}**
          (${{ steps['rag-ingest'].output.chunksIngested }} chunks) — not
          active yet.

          Run "Evaluate → Deploy (LLMOps Golden Path #2)" with
          artifactKind=rag-index, collectionName=${{ parameters.collectionName }},
          indexVersion=${{ steps['rag-ingest'].output.indexVersion }} to
          evaluate and activate it.
          {% endif %}

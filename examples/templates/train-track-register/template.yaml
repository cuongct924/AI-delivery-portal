apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: train-track-register
  title: "Train → Track → Register (Golden Path #1)"
  description: >
    Validates the dataset, trains (or fine-tunes) a model on the local Argo
    Workflows cluster, tracks the run in MLflow, registers the resulting
    model version, and opens a PR with its Catalog entry — calling
    services/orchestration-api the whole way, no mock steps.
  tags:
    - mlops

spec:
  owner: user:guest
  type: service

  parameters:
    - title: Model to train
      required:
        - modelName
        - datasetUri
        - taskType
        - repoUrl
      properties:
        modelName:
          title: Model name
          type: string
          description: E.g. "fraud-detection"
        datasetUri:
          title: Dataset URI
          type: string
          description: >
            A file:// path readable inside the training pod — the kind
            cluster mounts the repo's data/ directory at /mnt/data
            (infra/k8s-local-cluster/kind-config.yaml).
          default: file:///mnt/data/fraud-detection-sample.csv
        taskType:
          title: Task type
          type: string
          enum: [classification, regression, clustering]
          default: classification
        architecture:
          title: Architecture
          type: string
          enum: [sklearn, mlp, lstm, nlp, cv]
          default: sklearn
          description: >
            "sklearn" trains a classical algorithm (choose it below). "mlp"/
            "lstm" train a neural network instead — no clustering support,
            and "lstm" requires a time column for sequence windowing.
            "nlp" fine-tunes a pretrained HuggingFace text-classification
            model — taskType must be "classification", and requires
            textColumn/baseModelName below. "cv" fine-tunes a pretrained
            resnet18 on images — taskType must be "classification",
            datasetUri must be a .zip of
            <className>/<file> images (not a CSV — leave targetColumn
            empty, class comes from the folder name), and requires
            learningRate/epochs/batchSize below.
        algorithm:
          title: Algorithm (architecture=sklearn)
          type: string
          description: >
            Options depend on the task type selected above. Choose "custom"
            for BYOC — Dev-supplied training code instead of a registry
            algorithm; fill in the 3 fields below when chosen.
        codeRepoUrl:
          title: Code repository (algorithm=custom)
          type: string
          description: Git repo URL containing your training script.
        entrypointPath:
          title: Entrypoint path (algorithm=custom)
          type: string
          description: >
            Path, relative to the repo root, to the file defining
            `def train(dataset: pd.DataFrame, config: dict) -> tuple[Any, dict[str, float]]`.
        customConfig:
          title: Config JSON (algorithm=custom)
          type: string
          description: >
            JSON object of hyperparameters passed as `config` to your
            train() function, e.g. {"lr": 0.01}.
          default: "{}"
        hiddenLayers:
          title: Hidden layer sizes (architecture=mlp)
          type: array
          items:
            type: integer
          description: E.g. [64, 32] — one Linear+ReLU+Dropout block per entry.
        dropout:
          title: Dropout (architecture=mlp)
          type: number
        sequenceLength:
          title: Sequence length (architecture=lstm)
          type: integer
          description: Number of past rows in each sliding-window input.
        numLayers:
          title: LSTM layers (architecture=lstm)
          type: integer
        hiddenSize:
          title: Hidden size (architecture=lstm)
          type: integer
        learningRate:
          title: Learning rate (architecture=mlp/lstm)
          type: number
        epochs:
          title: Epochs (architecture=mlp/lstm)
          type: integer
        batchSize:
          title: Batch size (architecture=mlp/lstm)
          type: integer
        optimizer:
          title: Optimizer (architecture=mlp/lstm/nlp/cv)
          type: string
          enum: [adam, sgd]
          default: adam
          description: >
            How the network is fitted — a separate concept from which
            architecture/algorithm you picked above. "adam" (default) needs
            less manual tuning for most non-convex problems; "sgd" is the
            classic alternative.
        searchStrategy:
          title: Hyperparameter search strategy (architecture=mlp/lstm)
          type: string
          enum: [fixed, grid, random, bayesian]
          default: fixed
          description: >
            "fixed" (default) trains once with the values above, unchanged.
            "grid"/"random"/"bayesian" run multiple trials instead — set
            searchSpaceJson to say which hyperparameters to search, and
            objectiveMetric/numTrials below.
        numTrials:
          title: Number of trials (searchStrategy=random/bayesian)
          type: integer
          description: Ignored by "grid" — trial count there is the full grid size.
        searchSpaceJson:
          title: Search space JSON (searchStrategy!=fixed)
          type: string
          default: "{}"
          description: >
            JSON object mapping hyperparameter name to either
            {"choices": [...]} or {"low": ..., "high": ...}, e.g.
            {"learning_rate": {"low": 0.0001, "high": 0.1}}. Any
            hyperparameter above not listed here stays fixed at its value.
        objectiveMetric:
          title: Objective metric (searchStrategy!=fixed)
          type: string
          description: >
            Metric name to optimize across trials, e.g. "accuracy" or
            "mean_absolute_error" — must be one of the metrics this task
            type computes (see evaluations/gate.py TASK_TYPE_THRESHOLDS).
        objectiveDirection:
          title: Objective direction (searchStrategy!=fixed)
          type: string
          enum: [maximize, minimize]
          default: maximize
        textColumn:
          title: Text column (architecture=nlp)
          type: string
          description: Column containing the text to classify.
        baseModelName:
          title: Base model (architecture=nlp)
          type: string
          default: distilbert-base-uncased
          description: HuggingFace Hub model id to fine-tune.
        targetColumn:
          title: Target column
          type: string
          description: >
            Label column to predict — required for classification/
            regression, leave empty for clustering.
        idColumns:
          title: ID columns to exclude
          type: array
          items:
            type: string
          description: >
            Identifier columns to drop before training (never used as a
            feature), e.g. "transaction_id".
        timeColumn:
          title: Time column (optional)
          type: string
          description: >
            Leave empty if the data has no time ordering. If set, training
            always uses a chronological split (TimeSeriesSplit) instead of a
            random one, to avoid leaking future rows into the training set.
        baseModelUri:
          title: Base model (leave empty to train from scratch)
          type: string
          description: >
            MLflow model URI to fine-tune from — sets mode=finetune on the
            same train-register-golden-path Argo WorkflowTemplate (see
            services/orchestration-api/routers/models.py trigger_training()).
        repoUrl:
          title: Repository
          type: string
          description: >
            Target repo for the Catalog entry PR, in the format
            github.com?owner=<org>&repo=<repo> (same shape
            publish:github:pull-request expects). No RepoUrlPicker field
            extension is confirmed available in this repo's frontend, so
            this is a plain string field.
        useFeast:
          title: Enrich with Feast features
          type: boolean
          default: false
          description: >
            Merges precomputed features from the Feature Store
            (infra/feature-store/) into datasetUri before training. Most
            runs leave this off.
        entityIdColumn:
          title: Entity id column (useFeast=true)
          type: string
          description: >
            Column identifying each row for the Feast lookup, e.g.
            "transaction_id".
        featureNames:
          title: Feature names (useFeast=true)
          type: array
          items:
            type: string
          description: >
            Feast "<feature_view>:<feature>" references, e.g.
            "transaction_features:amount".
      # Backstage Scaffolder v1beta3 JSON Schema conditionals — same
      # if/then pattern used for other task-type-dependent fields.
      allOf:
        - if:
            properties:
              useFeast:
                const: true
          then:
            required:
              - entityIdColumn
              - featureNames
        - if:
            properties:
              taskType:
                const: classification
          then:
            properties:
              algorithm:
                enum:
                  - LogisticRegression
                  - RandomForestClassifier
                  - GradientBoostingClassifier
                  - KNeighborsClassifier
                  - SVC
                  - GaussianNB
                  - XGBClassifier
                  - LGBMClassifier
                  - CatBoostClassifier
                  - custom
        - if:
            properties:
              taskType:
                const: regression
          then:
            properties:
              algorithm:
                enum:
                  - LinearRegression
                  - Ridge
                  - Lasso
                  - RandomForestRegressor
                  - GradientBoostingRegressor
                  - SVR
                  - XGBRegressor
                  - LGBMRegressor
                  - CatBoostRegressor
                  - custom
        - if:
            properties:
              taskType:
                const: clustering
          then:
            properties:
              algorithm:
                enum:
                  - KMeans
                  - DBSCAN
                  - AgglomerativeClustering
                  - GaussianMixture
                  - custom
        - if:
            properties:
              taskType:
                enum: [classification, regression]
              architecture:
                not:
                  const: cv
          then:
            required:
              - targetColumn
        - if:
            properties:
              architecture:
                const: sklearn
          then:
            required:
              - algorithm
        - if:
            properties:
              architecture:
                const: mlp
          then:
            required:
              - hiddenLayers
              - dropout
              - learningRate
              - epochs
              - batchSize
        - if:
            properties:
              architecture:
                const: lstm
          then:
            required:
              - sequenceLength
              - numLayers
              - hiddenSize
              - learningRate
              - epochs
              - batchSize
              - timeColumn
        - if:
            properties:
              architecture:
                const: nlp
          then:
            required:
              - textColumn
              - baseModelName
              - learningRate
              - epochs
              - batchSize
        - if:
            properties:
              architecture:
                const: cv
          then:
            required:
              - learningRate
              - epochs
              - batchSize
        - if:
            properties:
              algorithm:
                const: custom
          then:
            required:
              - codeRepoUrl
              - entrypointPath
        - if:
            properties:
              searchStrategy:
                enum: [grid, random, bayesian]
          then:
            required:
              - objectiveMetric
        - if:
            properties:
              searchStrategy:
                enum: [random, bayesian]
          then:
            required:
              - numTrials

  steps:
    - id: enrich-features
      name: "Enrich dataset with Feast features"
      action: orchestration:enrich-dataset-features
      if: ${{ parameters.useFeast }}
      input:
        datasetUri: ${{ parameters.datasetUri }}
        entityIdColumn: ${{ parameters.entityIdColumn }}
        featureNames: ${{ parameters.featureNames }}

    - id: validate-dataset
      name: "Validate the dataset"
      action: orchestration:validate-dataset
      # Data Quality checks assume a CSV read via pd.read_csv — CV's
      # datasetUri is a .zip of images, skip this step.
      if: ${{ parameters.architecture !== 'cv' }}
      input:
        datasetUri: ${{ parameters.useFeast and steps['enrich-features'].output.datasetUri or parameters.datasetUri }}
        taskType: ${{ parameters.taskType }}
        targetColumn: ${{ parameters.targetColumn }}
        timeColumn: ${{ parameters.timeColumn }}

    - id: trigger-training
      name: "Train and register the model"
      action: orchestration:trigger-training
      input:
        modelName: ${{ parameters.modelName }}
        datasetUri: ${{ parameters.useFeast and steps['enrich-features'].output.datasetUri or parameters.datasetUri }}
        taskType: ${{ parameters.taskType }}
        architecture: ${{ parameters.architecture }}
        algorithm: ${{ parameters.algorithm }}
        targetColumn: ${{ parameters.targetColumn }}
        idColumns: ${{ parameters.idColumns }}
        timeColumn: ${{ parameters.timeColumn }}
        baseModelUri: ${{ parameters.baseModelUri }}
        hiddenLayers: ${{ parameters.hiddenLayers }}
        dropout: ${{ parameters.dropout }}
        sequenceLength: ${{ parameters.sequenceLength }}
        numLayers: ${{ parameters.numLayers }}
        hiddenSize: ${{ parameters.hiddenSize }}
        learningRate: ${{ parameters.learningRate }}
        epochs: ${{ parameters.epochs }}
        batchSize: ${{ parameters.batchSize }}
        optimizer: ${{ parameters.optimizer }}
        codeRepoUrl: ${{ parameters.codeRepoUrl }}
        entrypointPath: ${{ parameters.entrypointPath }}
        customConfig: ${{ parameters.customConfig }}
        searchStrategy: ${{ parameters.searchStrategy }}
        numTrials: ${{ parameters.numTrials }}
        searchSpaceJson: ${{ parameters.searchSpaceJson }}
        objectiveMetric: ${{ parameters.objectiveMetric }}
        objectiveDirection: ${{ parameters.objectiveDirection }}
        textColumn: ${{ parameters.textColumn }}
        baseModelName: ${{ parameters.baseModelName }}

    - id: model-summary
      name: "Fetch the model version's metrics"
      action: orchestration:model-summary
      input:
        modelName: ${{ parameters.modelName }}
        modelVersion: ${{ steps['trigger-training'].output.modelVersion }}

    - id: render-catalog-info
      name: "Generate the model's catalog entity"
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: catalog-output
        values:
          modelName: ${{ parameters.modelName }}
          modelVersion: ${{ steps['trigger-training'].output.modelVersion }}

    - id: publish-catalog-pr
      name: "Open the catalog entry PR"
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: register-${{ parameters.modelName }}-${{ steps['trigger-training'].output.modelVersion }}
        title: "Register ${{ parameters.modelName }}:${{ steps['trigger-training'].output.modelVersion }}"
        description: >
          Adds the Catalog entry for **${{ parameters.modelName }}** version
          **${{ steps['trigger-training'].output.modelVersion }}**, trained
          with ${{ parameters.algorithm }} (${{ parameters.taskType }}).
        sourcePath: catalog-output
        targetPath: catalog/${{ parameters.modelName }}

  output:
    links:
      - title: View run in MLflow
        url: http://localhost:5000
      - title: "Argo Workflow: ${{ steps['trigger-training'].output.workflowName }}"
        url: http://localhost:2746
      - title: View catalog entry pull request
        url: ${{ steps['publish-catalog-pr'].output.remoteUrl }}
    text:
      - title: Result
        content: |
          Trained and registered **${{ parameters.modelName }}** version
          **${{ steps['trigger-training'].output.modelVersion }}**
          (${{ parameters.algorithm }}, Argo Workflow
          `${{ steps['trigger-training'].output.workflowName }}`, finished
          as `${{ steps['trigger-training'].output.phase }}`).

          Metrics: `${{ steps['model-summary'].output.metrics }}`

          Catalog entry PR opened:
          ${{ steps['publish-catalog-pr'].output.remoteUrl }} — merge it to
          make the entity discoverable (add its path to `catalog.locations`
          per `CLAUDE.md`'s "Adding a Catalog entity" workflow rule).

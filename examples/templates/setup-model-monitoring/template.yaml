apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: setup-model-monitoring
  title: "Setup Model Monitoring (Phase 9)"
  description: >
    Registers a periodic Argo CronWorkflow that compares recent
    production input data against the model's training data with
    Evidently, logs the result to MLflow as a monitoring run, and — if you
    choose auto-retrain — calls the same trigger-training endpoint the
    other Golden Paths use when drift crosses your threshold. Unlike every
    other Golden Path here, this one doesn't run once and finish — it sets
    up a schedule and returns immediately.
  tags:
    - mlops
    - monitoring

spec:
  owner: user:guest
  type: service

  parameters:
    - title: Model to monitor
      required:
        - modelName
        - modelVersion
        - referenceDataUri
        - productionDataUri
        - schedule
      properties:
        modelName:
          title: Model name
          type: string
          description: Must already be registered (any Golden Path).
        modelVersion:
          title: Model version
          type: string
        referenceDataUri:
          title: Reference (training) data URI
          type: string
          description: >
            A file:// CSV path — normally the same datasetUri/
            interactionsUri the model was trained on.
        productionDataUri:
          title: Recent production data URI
          type: string
          description: >
            A file:// CSV path with recent real input data to compare
            against the reference data. Setting up automatic logging of
            live serving inputs into this file is a separate, not-yet-
            built piece — for now, point this at wherever your team
            already collects a sample of recent production inputs.
        schedule:
          title: Schedule (cron expression)
          type: string
          default: "0 0 * * *"
          description: >
            Standard 5-field cron. Common presets: "0 * * * *" (hourly),
            "0 0 * * *" (daily, default), "0 0 * * 0" (weekly).
        driftThreshold:
          title: Drift threshold
          type: number
          default: 0.5
          description: >
            Share of columns Evidently must flag as drifted (0-1) before
            this counts as "drift detected".
        onDriftDetected:
          title: On drift detected
          type: string
          enum: [alert-only, auto-retrain]
          default: alert-only
          description: >
            "alert-only" just logs the monitoring run to MLflow.
            "auto-retrain" also calls trigger-training automatically —
            real risk if the drift check false-positives, so this is your
            call, not the platform's.
        retrainRequestJson:
          title: Retrain request JSON (onDriftDetected=auto-retrain)
          type: string
          description: >
            The exact JSON body you'd POST to trigger-training by hand,
            e.g. {"model_name": "fraud-detection", "dataset_uri":
            "file:///mnt/data/fraud-detection-sample.csv", "task_type":
            "classification", "algorithm": "XGBClassifier"}.
      allOf:
        - if:
            properties:
              onDriftDetected:
                const: auto-retrain
          then:
            required:
              - retrainRequestJson

  steps:
    - id: setup-monitoring
      name: "Register the monitoring schedule"
      action: orchestration:setup-monitoring
      input:
        modelName: ${{ parameters.modelName }}
        modelVersion: ${{ parameters.modelVersion }}
        referenceDataUri: ${{ parameters.referenceDataUri }}
        productionDataUri: ${{ parameters.productionDataUri }}
        schedule: ${{ parameters.schedule }}
        driftThreshold: ${{ parameters.driftThreshold }}
        onDriftDetected: ${{ parameters.onDriftDetected }}
        retrainRequestJson: ${{ parameters.retrainRequestJson }}

  output:
    links:
      - title: View monitoring runs in MLflow
        url: http://localhost:5000
      - title: "CronWorkflow: ${{ steps['setup-monitoring'].output.cronWorkflowName }}"
        url: http://localhost:2746
    text:
      - title: Result
        content: |
          Monitoring scheduled for **${{ parameters.modelName }}** version
          **${{ parameters.modelVersion }}** — CronWorkflow
          `${{ steps['setup-monitoring'].output.cronWorkflowName }}` runs
          on `${{ parameters.schedule }}`, comparing production data
          against the reference dataset and logging drift_share to MLflow
          each time. On drift ≥ **${{ parameters.driftThreshold }}**:
          **${{ parameters.onDriftDetected }}**.

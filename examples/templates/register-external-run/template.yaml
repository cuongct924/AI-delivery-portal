apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: register-external-run
  title: "Register External Run"
  description: >
    Registers an already-trained MLflow run (e.g. from AI Notebook) into the
    Model Registry and opens a PR with its Catalog entry — the entry point
    for a model that wasn't trained through a Golden Path, calling
    services/orchestration-api the whole way, no mock steps.
  tags:
    - mlops

spec:
  owner: user:guest
  type: service

  parameters:
    - title: Run to register
      required:
        - modelName
        - artifactUri
        - taskType
        - repoUrl
      properties:
        modelName:
          title: Model name
          type: string
          description: E.g. "churn-classifier"
        artifactUri:
          title: Logged model URI
          type: string
          description: >
            The run's logged model URI, e.g. "runs:/<run_id>/churn-
            classifier" — printed as model_info.model_uri by the training
            script's mlflow.<flavor>.log_model() call.
        taskType:
          title: Task type
          type: string
          enum: [classification, regression, clustering]
        datasetVersion:
          title: Dataset version
          type: string
          description: >
            Optional free-text identifier for the dataset used — a DVC
            digest if the dataset is DVC-tracked, otherwise any label that
            helps trace this version back to its data.
        repoUrl:
          title: Repository
          type: string
          description: >
            Target repo for the Catalog entry PR, in the format
            github.com?owner=<org>&repo=<repo> (same shape
            publish:github:pull-request expects). No RepoUrlPicker field
            extension is confirmed available in this repo's frontend, so
            this is a plain string field.

  steps:
    - id: register-model
      name: "Register the model"
      action: orchestration:register-model
      input:
        modelName: ${{ parameters.modelName }}
        artifactUri: ${{ parameters.artifactUri }}
        taskType: ${{ parameters.taskType }}
        datasetVersion: ${{ parameters.datasetVersion }}

    - id: model-summary
      name: "Fetch the model version's metrics"
      action: orchestration:model-summary
      input:
        modelName: ${{ parameters.modelName }}
        modelVersion: ${{ steps['register-model'].output.modelVersion }}

    - id: render-catalog-info
      name: "Generate the model's catalog entity"
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: catalog-output
        values:
          modelName: ${{ parameters.modelName }}
          modelVersion: ${{ steps['register-model'].output.modelVersion }}

    - id: publish-catalog-pr
      name: "Open the catalog entry PR"
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: register-${{ parameters.modelName }}-${{ steps['register-model'].output.modelVersion }}
        title: "Register ${{ parameters.modelName }}:${{ steps['register-model'].output.modelVersion }}"
        description: >
          Adds the Catalog entry for **${{ parameters.modelName }}** version
          **${{ steps['register-model'].output.modelVersion }}**
          (${{ parameters.taskType }}), registered from an external run.
        sourcePath: catalog-output
        targetPath: catalog/${{ parameters.modelName }}

  output:
    links:
      - title: View run in MLflow
        url: http://localhost:5000
      - title: View catalog entry pull request
        url: ${{ steps['publish-catalog-pr'].output.remoteUrl }}
    text:
      - title: Result
        content: |
          Registered **${{ parameters.modelName }}** version
          **${{ steps['register-model'].output.modelVersion }}**
          (${{ parameters.taskType }}).

          Metrics: `${{ steps['model-summary'].output.metrics }}`

          Catalog entry PR opened:
          ${{ steps['publish-catalog-pr'].output.remoteUrl }} — merge it to
          make the entity discoverable (add its path to `catalog.locations`
          per `CLAUDE.md`'s "Adding a Catalog entity" workflow rule).

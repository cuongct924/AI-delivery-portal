# Mirrors ../../train-track-register/skeleton/catalog-info.yaml — same
# shape, templated by ../template.yaml.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.modelName }}
  description: "Model registered via Register External Run"
  tags:
    - ml-model
    - mlops
  annotations:
    mlflow.org/model-version: ${{ values.modelVersion }}
spec:
  type: ml-model
  owner: group:${{ values.owner }}

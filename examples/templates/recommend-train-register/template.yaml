apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: recommend-train-register
  title: "Recommend → Track → Register (Golden Path #3)"
  description: >
    Validates the interactions dataset, trains a Recommendation System
    algorithm on the local Argo Workflows cluster, tracks the run in
    MLflow, registers the resulting model version, and opens a PR with its
    Catalog entry (mục 6e, docs/mlops-lifecycle-software-template.md) —
    calling services/orchestration-api the whole way, no mock steps.
  tags:
    - mlops
    - recsys

spec:
  owner: user:guest
  type: service

  parameters:
    - title: Recommendation model to train
      required:
        - modelName
        - interactionsUri
        - userIdColumn
        - itemIdColumn
        - timestampColumn
        - algorithm
        - repoUrl
      properties:
        modelName:
          title: Model name
          type: string
          description: E.g. "product-recommender"
        interactionsUri:
          title: Interactions dataset URI
          type: string
          description: >
            A file:// path readable inside the training pod — 1 row per
            (user, item) interaction (mục 6e.2).
          default: file:///mnt/data/interactions-sample.csv
        userIdColumn:
          title: User id column
          type: string
          default: user_id
        itemIdColumn:
          title: Item id column
          type: string
          default: item_id
        timestampColumn:
          title: Timestamp column
          type: string
          default: timestamp
          description: >
            Used for the global temporal split (mục 6e.2) — sorted
            ascending, last 20% becomes the test period.
        ratingColumn:
          title: Rating column (algorithm=svd/knn)
          type: string
          description: >
            Explicit feedback column — required for the collaborative-
            explicit family (svd/knn); leave empty for implicit-feedback
            algorithms (als/bpr/tfidf_cosine/popularity).
        algorithm:
          title: Algorithm
          type: string
          enum: [als, bpr, svd, knn, tfidf_cosine, popularity]
          description: >
            als/bpr: collaborative filtering on implicit feedback (just
            interactions). svd/knn: collaborative filtering on explicit
            feedback (needs ratingColumn). tfidf_cosine: content-based
            (needs itemFeaturesUri below). popularity: baseline, same
            top-k for everyone (mục 6e.1). No "hybrid" option — the
            planned lightfm entry doesn't build on this Python version
            (mục 6e.5).
        k:
          title: Recommendation list length (k)
          type: integer
          default: 10
          description: Used for recall@k/ndcg@k/map@k (mục 6e.3).
        hyperparametersJson:
          title: Hyperparameters JSON
          type: string
          default: "{}"
          description: >
            JSON object of the chosen algorithm's own hyperparameters, e.g.
            {"factors": 50, "iterations": 15} for als/bpr, {"n_factors": 50,
            "n_epochs": 20} for svd, {"k": 40} for knn. Unset ones use
            train_rec.py's defaults.
        itemFeaturesUri:
          title: Item features URI (algorithm=tfidf_cosine)
          type: string
          description: A file:// path to item metadata — 1 row per item.
        itemIdColumnFeatures:
          title: Item id column in item features (algorithm=tfidf_cosine)
          type: string
        itemTextColumn:
          title: Item text column (algorithm=tfidf_cosine)
          type: string
          description: The text tfidf_cosine builds item vectors from.
        repoUrl:
          title: Repository
          type: string
          description: >
            Target repo for the Catalog entry PR, in the format
            github.com?owner=<org>&repo=<repo>.
      allOf:
        - if:
            properties:
              algorithm:
                enum: [svd, knn]
          then:
            required:
              - ratingColumn
        - if:
            properties:
              algorithm:
                const: tfidf_cosine
          then:
            required:
              - itemFeaturesUri
              - itemIdColumnFeatures
              - itemTextColumn

  steps:
    - id: validate-rec-dataset
      name: "Validate the interactions dataset"
      action: orchestration:validate-rec-dataset
      input:
        interactionsUri: ${{ parameters.interactionsUri }}
        userIdColumn: ${{ parameters.userIdColumn }}
        itemIdColumn: ${{ parameters.itemIdColumn }}

    - id: trigger-rec-training
      name: "Train and register the recommender"
      action: orchestration:trigger-rec-training
      input:
        modelName: ${{ parameters.modelName }}
        interactionsUri: ${{ parameters.interactionsUri }}
        userIdColumn: ${{ parameters.userIdColumn }}
        itemIdColumn: ${{ parameters.itemIdColumn }}
        timestampColumn: ${{ parameters.timestampColumn }}
        ratingColumn: ${{ parameters.ratingColumn }}
        algorithm: ${{ parameters.algorithm }}
        k: ${{ parameters.k }}
        hyperparametersJson: ${{ parameters.hyperparametersJson }}
        itemFeaturesUri: ${{ parameters.itemFeaturesUri }}
        itemIdColumnFeatures: ${{ parameters.itemIdColumnFeatures }}
        itemTextColumn: ${{ parameters.itemTextColumn }}

    - id: model-summary
      name: "Fetch the model version's metrics"
      action: orchestration:model-summary
      input:
        modelName: ${{ parameters.modelName }}
        modelVersion: ${{ steps['trigger-rec-training'].output.modelVersion }}

    - id: render-catalog-info
      name: "Generate the model's catalog entity"
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: catalog-output
        values:
          modelName: ${{ parameters.modelName }}
          modelVersion: ${{ steps['trigger-rec-training'].output.modelVersion }}

    - id: publish-catalog-pr
      name: "Open the catalog entry PR"
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: register-${{ parameters.modelName }}-${{ steps['trigger-rec-training'].output.modelVersion }}
        title: "Register ${{ parameters.modelName }}:${{ steps['trigger-rec-training'].output.modelVersion }}"
        description: >
          Adds the Catalog entry for **${{ parameters.modelName }}** version
          **${{ steps['trigger-rec-training'].output.modelVersion }}**,
          trained with ${{ parameters.algorithm }} (ranking).
        sourcePath: catalog-output
        targetPath: catalog/${{ parameters.modelName }}

  output:
    links:
      - title: View run in MLflow
        url: http://localhost:5000
      - title: "Argo Workflow: ${{ steps['trigger-rec-training'].output.workflowName }}"
        url: http://localhost:2746
      - title: View catalog entry pull request
        url: ${{ steps['publish-catalog-pr'].output.remoteUrl }}
    text:
      - title: Result
        content: |
          Trained and registered **${{ parameters.modelName }}** version
          **${{ steps['trigger-rec-training'].output.modelVersion }}**
          (${{ parameters.algorithm }}, Argo Workflow
          `${{ steps['trigger-rec-training'].output.workflowName }}`, finished
          as `${{ steps['trigger-rec-training'].output.phase }}`).

          Metrics: `${{ steps['model-summary'].output.metrics }}`

          Catalog entry PR opened:
          ${{ steps['publish-catalog-pr'].output.remoteUrl }} — merge it to
          make the entity discoverable (add its path to `catalog.locations`
          per `CLAUDE.md`'s "Adding a Catalog entity" workflow rule).

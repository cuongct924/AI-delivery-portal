# Mirrors ../../train-track-register/skeleton/catalog-info.yaml, templated
# by ../template.yaml — same shape, different Golden Path (#3).
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.modelName }}
  description: "Model registered via Golden Path #3 (Recommend -> Track -> Register)"
  tags:
    - ml-model
    - mlops
    - recsys
  annotations:
    mlflow.org/model-version: ${{ values.modelVersion }}
spec:
  type: ml-model
  owner: group:${{ values.owner }}

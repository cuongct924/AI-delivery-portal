apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: hello-golden-path
  title: "Hello Golden Path (test)"
  description: >
    First test template — doesn't call real MLflow yet, just logs information
    to understand how the Scaffolder mechanism works before writing a real Custom Action.
  tags:
    - mlops
    - test
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Enter fake model information
      required:
        - modelName
        - modelVersion
      properties:
        modelName:
          title: Model name
          type: string
          description: E.g. "fraud-detection"
        modelVersion:
          title: Version
          type: string
          description: E.g. "v1.0.0"

  steps:
    - id: log-info
      name: "Log info (mock policy-check step)"
      action: debug:log
      input:
        message: "Preparing to deploy model ${{ parameters.modelName }} version ${{ parameters.modelVersion }}"

    - id: log-done
      name: "Log completion (mock deploy step)"
      action: debug:log
      input:
        message: "Finished 'deploying' ${{ parameters.modelName }}:${{ parameters.modelVersion }} (this is a mock step — will be replaced with an HTTP call to FastAPI in week 3-4)"

  output:
    text:
      - title: Result
        content: |
          Golden path test complete for model **${{ parameters.modelName }}**
          version **${{ parameters.modelVersion }}**.

          Next step (week 2-3): replace `debug:log` with a real Custom Action
          that calls the FastAPI backend, which then calls the Adapter to MLflow.

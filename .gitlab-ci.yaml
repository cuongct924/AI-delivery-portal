# CI pipeline for AI Delivery Portal.
#
# NOTE: the repo is hosted on GitHub, so this file does NOT run anywhere by
# itself — GitHub only executes .github/workflows/*.yml. The actual active
# pipeline is .github/workflows/ci.yml (a job-for-job port of this file).
# This file is kept as reference, and works as-is if this repo is ever
# connected to a GitLab project via "CI/CD for external repositories".
# Keep both files in sync when changing a job.
#
# Mirrors exactly what `make check` / `yarn tsc` / `yarn lint:all` / the 4
# Dockerfile builds / Trivy / Checkov / Gitleaks already verify locally in
# this repo — nothing here is speculative, every stage was run by hand
# first. See README.md "Usage" / Makefile for the same commands.

stages:
  - lint
  - test
  - build

# Avoid duplicate pipelines (one for the branch push, one for the MR) on the
# same commit — a very common GitLab CI gotcha otherwise.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  interruptible: true

# ---------------------------------------------------------------------------
# Python — ruff (lint + format), pyright (types), pytest (tests + coverage)
# ---------------------------------------------------------------------------

python:checks:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files:
        - dev.lock.txt
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends make >/dev/null
    - python3.12 -m venv .venv
    - .venv/bin/pip install --upgrade pip -q
    - .venv/bin/pip install -r dev.lock.txt -q
  script:
    - .venv/bin/ruff check .
    - .venv/bin/ruff format --check .
    - .venv/bin/pyright
    - .venv/bin/pytest --cov-report=xml --junitxml=report.xml
  coverage: '/TOTAL.+?(\d+)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ---------------------------------------------------------------------------
# TypeScript — Portal (packages/app-backstage, packages/backend, plugins/*)
# ---------------------------------------------------------------------------

frontend:checks:
  stage: test
  image: node:22-bookworm
  variables:
    YARN_CACHE_FOLDER: "$CI_PROJECT_DIR/.yarn/cache"
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - .yarn/cache
  before_script:
    # A few workspace deps (better-sqlite3, tree-sitter, ...) compile native
    # addons on install — same reason packages/backend/Dockerfile needs this.
    - apt-get update -qq && apt-get install -y --no-install-recommends libsqlite3-dev >/dev/null
    - corepack enable
    - yarn install --immutable
  script:
    - yarn tsc
    - yarn lint:all

# ---------------------------------------------------------------------------
# Security — shift-left: secrets + IaC misconfig run early, fast, every push
# ---------------------------------------------------------------------------

security:gitleaks:
  stage: lint
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact -v

security:checkov:
  stage: lint
  image: bridgecrew/checkov:3.3.9
  script:
    - checkov --directory . --framework dockerfile,argo_workflows,github_actions
        --skip-path node_modules --skip-path .venv --skip-path packages --skip-path plugins
        --compact --quiet

# ---------------------------------------------------------------------------
# Docker — build all 4 service images, then Trivy-scan each.
# --ignore-unfixed: don't fail the pipeline on upstream CVEs with no patch
# available yet (e.g. perl-base in python:3.12-slim) — only on CVEs we can
# actually act on. See docs/architecture.md for the one currently-tracked
# exception (cryptography, pinned below 50 by mlflow itself).
#
# NOTE: packages/backend/Dockerfile (the Backstage backend image) is not
# built here yet — it needs a full `yarn build:backend` first and hasn't
# been wired into this pipeline yet.
# ---------------------------------------------------------------------------

docker:build-and-scan:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - apk add --no-cache curl >/dev/null
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker build -t orchestration-api:$CI_COMMIT_SHORT_SHA -f services/orchestration-api/Dockerfile services/orchestration-api
    - docker build -t mlops-server:$CI_COMMIT_SHORT_SHA -f agents/mcp-servers/mlops-server/Dockerfile .
    - docker build -t k8s-server:$CI_COMMIT_SHORT_SHA -f agents/mcp-servers/k8s-server/Dockerfile .
    - docker build -t metrics-server:$CI_COMMIT_SHORT_SHA -f agents/mcp-servers/metrics-server/Dockerfile .
    - |
      for img in orchestration-api mlops-server k8s-server metrics-server; do
        echo "=== Trivy scan: $img ==="
        trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$img:$CI_COMMIT_SHORT_SHA"
      done
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        for img in orchestration-api mlops-server k8s-server metrics-server; do
          docker tag "$img:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/$img:$CI_COMMIT_SHORT_SHA"
          docker tag "$img:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/$img:latest"
          docker push "$CI_REGISTRY_IMAGE/$img:$CI_COMMIT_SHORT_SHA"
          docker push "$CI_REGISTRY_IMAGE/$img:latest"
        done
      fi

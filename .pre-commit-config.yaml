repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Runs from the project's own .venv (needs every service's dependencies
  # installed to resolve imports correctly) — not a pre-commit-managed env.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: .venv/bin/pyright
        language: system
        types: [python]
        pass_filenames: false

  # Native CLI, not CI's Docker image — too slow per-commit. Scans staged
  # changes only, not full history.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --redact -v
        language: system
        pass_filenames: false

  # Native CLI, same framework/skip-path as CI's security-checkov job.
  - repo: local
    hooks:
      - id: checkov
        name: checkov
        entry: checkov --directory . --framework dockerfile,argo_workflows,github_actions
          --skip-path node_modules --skip-path .venv --skip-path packages --skip-path plugins
          --compact --quiet
        language: system
        pass_filenames: false

# CI pipeline for AI Delivery Portal.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Security — shift-left: secrets + IaC misconfig run early, fast, every push
  # ---------------------------------------------------------------------
  security-gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans git history, not just the working tree
      - run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1 detect --source . --redact -v

  security-checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo
          bridgecrew/checkov:3.3.9 --directory . --framework dockerfile,argo_workflows,github_actions
          --skip-path node_modules --skip-path .venv --skip-path packages --skip-path plugins
          --compact --quiet

  # ---------------------------------------------------------------------
  # Python — ruff (lint + format), pyright (types), pytest (tests + coverage)
  # ---------------------------------------------------------------------
  python-checks:
    needs: [security-gitleaks, security-checkov]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # NOTE: plain ubuntu-latest, not a python:3.12-slim container — that
      # image's missing git/libatomic1 caused repeated CI failures.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        if: ${{ !env.ACT }}
        with:
          path: .cache/pip
          key: pip-${{ hashFiles('dev.lock.txt') }}
      # libatomic1: pyright's bundled Node.js needs it; not always preinstalled.
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libatomic1
      - run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --upgrade pip -q
          .venv/bin/pip install -r dev.lock.txt -q
        env:
          PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      # NOTE: catches lock files edited by hand instead of via `make lock`.
      - run: make lock
      - run: |
          if ! git diff --exit-code --quiet; then
            echo "::error::Lock files are out of date with their requirements.txt — run 'make lock' locally, review the diff, and commit the result."
            git diff --stat
            exit 1
          fi
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pyright
      - run: .venv/bin/pytest --cov-report=xml --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !env.ACT }}
        with:
          name: python-test-results
          path: |
            report.xml
            coverage.xml

  # ---------------------------------------------------------------------
  # TypeScript — Portal (packages/app-backstage, packages/backend, plugins/*)
  # ---------------------------------------------------------------------
  frontend-checks:
    needs: [security-gitleaks, security-checkov]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y --no-install-recommends libsqlite3-dev
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn lint:all

  # ---------------------------------------------------------------------
  # Docker — build all 4 service images, then Trivy-scan each.
  # --ignore-unfixed: don't fail on upstream CVEs with no patch available yet
  # (e.g. perl-base in python:3.12-slim) — only on CVEs we can actually act
  # on. See docs/architecture.md for the one currently-tracked exception
  # (cryptography, pinned below 50 by mlflow itself).
  #
  # NOTE: packages/backend/Dockerfile (the Backstage backend image) is not
  # built here yet — it needs a full `yarn build:backend` first and hasn't
  # been wired into this pipeline yet.
  # ---------------------------------------------------------------------
  docker-build-and-scan:
    needs: [python-checks, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Pinned release tarball, not `curl | sh` from a script URL.
      - name: Install Trivy
        run: curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz | sudo tar -xz -C /usr/local/bin trivy
      - name: Set image tag vars
        run: |
          echo "SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_ENV"
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build images
        run: |
          docker build -t orchestration-api:$SHORT_SHA -f services/orchestration-api/Dockerfile .
          docker build -t mlops-observability-server:$SHORT_SHA -f agents/mcp-servers/mlops-observability-server/Dockerfile .
          docker build -t golden-paths-server:$SHORT_SHA -f agents/mcp-servers/golden-paths-server/Dockerfile .
          docker build -t training-image:$SHORT_SHA -f infra/argo-workflows/training-image/Dockerfile .
      - name: Trivy scan
        run: |
          for img in orchestration-api mlops-observability-server golden-paths-server training-image; do
            echo "=== Trivy scan: $img ==="
            trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$img:$SHORT_SHA"
          done
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images
        if: github.ref == 'refs/heads/main'
        run: |
          for img in orchestration-api mlops-observability-server golden-paths-server training-image; do
            docker tag "$img:$SHORT_SHA" "ghcr.io/$REPO_LC/$img:$SHORT_SHA"
            docker tag "$img:$SHORT_SHA" "ghcr.io/$REPO_LC/$img:latest"
            docker push "ghcr.io/$REPO_LC/$img:$SHORT_SHA"
            docker push "ghcr.io/$REPO_LC/$img:latest"
          done

version: 2
updates:
  # Yarn workspaces (packages/*, plugins/*) — see root package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      backstage:
        patterns:
          - "@backstage/*"

  # Python — each service resolves its own requirements.txt independently
  # (see Makefile SERVICE_REQS), so each needs its own entry here too.
  # Major version bumps are excluded on purpose: Dependabot edits *.lock.txt
  # in place rather than re-running a full `uv pip compile` resolution, which
  # let pandas==3.0.5 (violates mlflow's own `pandas<3`) slip through
  # unnoticed once — major upgrades need a human running `make lock` and
  # reviewing the diff instead.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/adapters"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/services/orchestration-api"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/agents/mcp-servers/mlops-server"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/agents/mcp-servers/k8s-server"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/agents/mcp-servers/metrics-server"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker — base images in each Dockerfile, plus docker-compose.yml at root
  # (Dependabot's "docker" ecosystem covers both when directory is given).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/orchestration-api"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/packages/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/agents/mcp-servers/mlops-server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/agents/mcp-servers/k8s-server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/agents/mcp-servers/metrics-server"
    schedule:
      interval: "weekly"

  # Actions used in .github/workflows/ci.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

# Profiles: mlops (Golden Path #1/#2), llmops (RAG/vector search), observability
# (metrics/dashboards, optional for either). Run one with e.g.
# `docker compose --profile mlops up -d`, or combine multiple --profile flags.
services:
  # Image tags pinned to verified releases, not `latest`, for reproducible builds.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1  # matches mlflow==3.15.1 in the Python lock files
    container_name: ai-delivery-portal-mlflow
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    profiles: ["mlops"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: ai-delivery-portal-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      # Host 8082 — 8080 is held by the kind cluster (kind-config.yaml extraPortMappings).
      - "8082:8080"
    profiles: ["mlops"]

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ai-delivery-portal-prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:13.2.0
    container_name: ai-delivery-portal-grafana
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3001:3000"  # host 3001 — Backstage's dev server already owns 3000
    depends_on:
      - prometheus
    profiles: ["observability"]

  qdrant:
    image: qdrant/qdrant:v1.19.0  # matches qdrant-client==1.19.0 in the Python lock files
    container_name: ai-delivery-portal-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    profiles: ["llmops"]

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: ai-delivery-portal-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"  # S3 API — DVC remote (.dvc/config) points here for local dev
      - "9001:9001"  # web console
    profiles: ["mlops"]

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.66.0-stable
    container_name: ai-delivery-portal-litellm
    command: --config /app/config.yaml --port 4000
    volumes:
      - ./infra/llm-gateways/litellm-config.yaml:/app/config.yaml:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
    ports:
      - "4000:4000"
    profiles: ["llmops"]

  orchestration-api:
    build:
      context: .
      dockerfile: services/orchestration-api/Dockerfile
    container_name: ai-delivery-portal-orchestration-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      AUTH_ENABLED: "true"
      KEYCLOAK_URL: http://keycloak:8080
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LITELLM_GATEWAY_URL: http://litellm:4000
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - mlflow
      - keycloak
    profiles: ["mlops"]

  mlops-mcp-server:
    build:
      context: .
      dockerfile: agents/mcp-servers/mlops-server/Dockerfile
    container_name: ai-delivery-portal-mlops-mcp-server
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    # No depends_on: mlflow is a different profile — start it yourself first
    # if you need it reachable (docker compose --profile mlops up -d mlflow).
    # stdio transport exits on EOF with no attached stdin — `up -d` isn't the
    # right way to run it. Spawn on demand: `docker compose run -i mlops-mcp-server`.
    profiles: ["manual"]

  k8s-mcp-server:
    build:
      context: .
      dockerfile: agents/mcp-servers/k8s-server/Dockerfile
    container_name: ai-delivery-portal-k8s-mcp-server
    # stdio transport exits on EOF with no attached stdin — `up -d` isn't the
    # right way to run it. Spawn on demand: `docker compose run -i k8s-mcp-server`.
    profiles: ["manual"]

  metrics-mcp-server:
    build:
      context: .
      dockerfile: agents/mcp-servers/metrics-server/Dockerfile
    container_name: ai-delivery-portal-metrics-mcp-server
    environment:
      PROMETHEUS_URL: http://prometheus:9090
    # No depends_on: prometheus is a different profile — start it yourself
    # first if needed (docker compose --profile observability up -d prometheus).
    # stdio transport exits on EOF with no attached stdin — `up -d` isn't the
    # right way to run it. Spawn on demand: `docker compose run -i metrics-mcp-server`.
    profiles: ["manual"]

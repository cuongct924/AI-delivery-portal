app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: http://localhost:7007

backend:
  # Must be reachable by all callers, not just localhost.
  baseUrl: http://localhost:7007
  # ':7007' binds all interfaces — the most permissive option.
  listen: ':7007'

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

auth:
  providers:
    guest: {}

catalog:
  # Overrides app-config.yaml's example-data locations.
  # See https://backstage.io/docs/features/software-catalog/#adding-components-to-the-catalog
  locations:
    # Demo data — replace with your production config. Paths are relative
    # to the backend process (repo root in a deployed container).
    - type: file
      target: ./examples/entities.yaml

    # AI Delivery Portal — Golden Path #1 (Train→Track→Register)
    - type: file
      target: ./examples/templates/train-track-register/template.yaml
      rules:
        - allow: [Template]

    # AI Delivery Portal — Golden Path #2 (Register→Deploy)
    - type: file
      target: ./examples/templates/register-deploy/template.yaml
      rules:
        - allow: [Template]

    # AI Delivery Portal — Register External Run
    - type: file
      target: ./examples/templates/register-external-run/template.yaml
      rules:
        - allow: [Template]

    # AI Delivery Portal — Golden Path #3 (Recommend→Track→Register)
    - type: file
      target: ./examples/templates/recommend-train-register/template.yaml
      rules:
        - allow: [Template]

    # AI Delivery Portal — Setup Model Monitoring
    - type: file
      target: ./examples/templates/setup-model-monitoring/template.yaml
      rules:
        - allow: [Template]

    # AI Delivery Portal — Serving LLM
    - type: file
      target: ./examples/templates/deploy-llm/template.yaml
      rules:
        - allow: [Template]

    # AI Delivery Portal — LLMOps Golden Path #1 (Draft/Ingest→Register)
    - type: file
      target: ./examples/templates/llm-draft-register/template.yaml
      rules:
        - allow: [Template]

    # AI Delivery Portal — LLMOps Golden Path #2 (Evaluate→Deploy)
    - type: file
      target: ./examples/templates/llm-evaluate-deploy/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

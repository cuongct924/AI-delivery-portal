apiVersion: v1
kind: Service
metadata:
  name: {{ include "orchestration-api.fullname" . }}
  labels:
    {{- include "orchestration-api.labels" . | nindent 4 }}
spec:
  # ClusterIP, not NodePort — nothing outside the cluster needs to call
  # orchestration-api directly; only Portal does, in-cluster.
  type: ClusterIP
  selector:
    {{- include "orchestration-api.labels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000

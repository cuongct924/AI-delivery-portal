apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orchestration-api.fullname" . }}
  labels:
    {{- include "orchestration-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "orchestration-api.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orchestration-api.labels" . | nindent 8 }}
    spec:
      # Matches the Dockerfile's `USER appuser --uid 1000`.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      automountServiceAccountToken: false
      containers:
        - name: orchestration-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orchestration-api.fullname" . }}-secrets
                  key: anthropicApiKey
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orchestration-api.fullname" . }}-secrets
                  key: litellmMasterKey
          # /healthz — same endpoint services/orchestration-api/Dockerfile's
          # own HEALTHCHECK already uses.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

# Real values passed via --set/-f values.local.yaml at install time — see
# values.yaml's comment. Never commit real secrets to this file's defaults.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orchestration-api.fullname" . }}-secrets
type: Opaque
stringData:
  anthropicApiKey: {{ .Values.secrets.anthropicApiKey | quote }}
  litellmMasterKey: {{ .Values.secrets.litellmMasterKey | quote }}

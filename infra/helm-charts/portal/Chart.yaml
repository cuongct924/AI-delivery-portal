apiVersion: v2
name: portal
description: >-
  Backstage backend (packages/backend) — additive GitOps/production-like
  demo deploy (via ArgoCD on kind), not a replacement for `yarn start`
  local dev. Runs with app-config.yaml (dev-mode, in-memory SQLite, guest
  auth) — not app-config.production.yaml, which needs a Postgres that
  doesn't exist anywhere in this project yet.

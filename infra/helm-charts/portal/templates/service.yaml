apiVersion: v1
kind: Service
metadata:
  name: {{ include "portal.fullname" . }}
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "portal.labels" . | nindent 4 }}
  ports:
    - port: 7007
      targetPort: 7007
      nodePort: {{ .Values.nodePort }}

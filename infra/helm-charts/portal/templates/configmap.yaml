# Overrides baseUrl/cors.origin for the NodePort — app-config.yaml bakes in
# localhost values only correct for `yarn start`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "portal.fullname" . }}-config
data:
  app-config.local.yaml: |
    app:
      baseUrl: {{ .Values.externalUrl }}
    backend:
      baseUrl: {{ .Values.externalUrl }}
      cors:
        origin: {{ .Values.externalUrl }}

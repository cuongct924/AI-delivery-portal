apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portal.fullname" . }}
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "portal.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "portal.labels" . | nindent 8 }}
    spec:
      # Matches the Dockerfile's `USER node` (built-in UID 1000).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      automountServiceAccountToken: false
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Overrides the Dockerfile's CMD to use app-config.local.yaml
          # (dev-mode SQLite) instead of app-config.production.yaml (needs Postgres).
          command: ["node", "packages/backend"]
          args:
            - --config
            - app-config.yaml
            - --config
            - app-config.local.yaml
          ports:
            - containerPort: 7007
          volumeMounts:
            - name: local-config
              mountPath: /app/app-config.local.yaml
              subPath: app-config.local.yaml
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: local-config
          configMap:
            name: {{ include "portal.fullname" . }}-config

# Verified against docs.kargo.io/user-guide/how-to-guides/working-with-projects
# (Project + ProjectConfig/promotionPolicies schema fetched directly).
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: ai-delivery-portal
---
# Cả 2 stage "staging-<tenant>" auto-promote; không có entry nào cho
# "prod-<tenant>" — theo docs Kargo, Stage không khớp promotionPolicies
# nào thì "requires manual intervention" để promote vào — đây là approval
# gate thật cho prod, độc lập theo từng tenant (thay cho thiết kế
# require_group/Keycloak-groups tự chế ở bản kế hoạch đầu).
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: ai-delivery-portal
  namespace: ai-delivery-portal
spec:
  promotionPolicies:
    - stageSelector:
        name: staging-mlops-team
      autoPromotionEnabled: true
    - stageSelector:
        name: staging-llmops-team
      autoPromotionEnabled: true

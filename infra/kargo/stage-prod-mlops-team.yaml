# Nguồn Freight từ Stage staging-mlops-team — KHÔNG có entry trong
# project.yaml's promotionPolicies => bắt buộc duyệt thủ công
# (`kargo approve`/UI) trước khi promote — đây là gate approval thật cho prod.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod-mlops-team
  namespace: ai-delivery-portal
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: inference-services-mlops-team
      sources:
        stages:
          - staging-mlops-team
  promotionTemplate:
    spec:
      steps:
        - task:
            name: copy-inference-services
          as: promo
          vars:
            - name: tenant
              value: mlops-team
            - name: envName
              value: prod

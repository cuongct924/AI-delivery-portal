# Nguồn Freight trực tiếp từ Warehouse của tenant "llmops-team" — auto-promote
# theo project.yaml's ProjectConfig.promotionPolicies (stage "staging-llmops-team").
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging-llmops-team
  namespace: ai-delivery-portal
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: inference-services-llmops-team
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: copy-inference-services
          as: promo
          vars:
            - name: tenant
              value: llmops-team
            - name: envName
              value: staging

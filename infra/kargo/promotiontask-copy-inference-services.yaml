# Dùng chung cho cả 4 Stage (staging/prod x mlops-team/llmops-team) —
# nhận `tenant`/`envName` qua `vars` override tại nơi gọi task (xem
# stage-*.yaml), không suy ra từ `ctx.stage` vì tên Stage giờ là
# "staging-<tenant>"/"prod-<tenant>", không phải tên môi trường đơn thuần.
#
# Steps `git-clone`/`git-commit`/`git-push`/`argocd-update` chép nguyên
# văn từ ví dụ PromotionTask trong quickstart thật của docs.kargo.io. Step
# `copy` xác nhận có tồn tại (docs.kargo.io/user-guide/reference-docs/
# promotion-steps/) nhưng field `inPath`/`outPath` CHƯA xác nhận từ ví dụ
# thật — kiểm tra lại trang đó trước khi chạy.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: copy-inference-services
  namespace: ai-delivery-portal
spec:
  vars:
    - name: gitopsRepo
      value: https://github.com/cuongct924/AI-delivery-portal.git
    - name: tenant
      value: ""
    - name: envName
      value: ""
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitopsRepo }}
        checkout:
          - branch: main
            path: ./work
    - uses: copy
      config:
        inPath: ./work/infra/environments/dev/inference-services/${{ vars.tenant }}
        outPath: ./work/infra/environments/${{ vars.envName }}/inference-services/${{ vars.tenant }}
    - uses: git-commit
      as: commit
      config:
        path: ./work
        message: "promote ${{ vars.tenant }}'s inference-services to ${{ vars.envName }}"
    - uses: git-push
      config:
        path: ./work
    - uses: argocd-update
      config:
        apps:
          - name: inference-services-${{ vars.envName }}-${{ vars.tenant }}
            sources:
              - repoURL: ${{ vars.gitopsRepo }}
                desiredRevision: ${{ task.outputs.commit.commit }}

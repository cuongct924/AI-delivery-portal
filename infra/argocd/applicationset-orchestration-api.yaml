# Replaces orchestration-api-app.yaml (1 hand-written Application) — 1
# entry per environment, values overlay per environment. Uses a `list`
# generator (not a `git` directory generator) because each environment
# needs a *different* AppProject (dev = self-service, staging/prod =
# platform-only) and ArgoCD's plain `git` directory generator can't
# express that conditionally — see appproject-self-service.yaml's header
# comment.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: orchestration-api
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            project: platform
          - env: staging
            project: platform
          - env: prod
            project: platform
  template:
    metadata:
      name: "orchestration-api-{{env}}"
    spec:
      project: "{{project}}"
      source:
        repoURL: https://github.com/cuongct924/AI-delivery-portal.git
        targetRevision: main
        path: infra/helm-charts/orchestration-api
        helm:
          valueFiles:
            - ../../environments/{{env}}/orchestration-api/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "ai-delivery-portal-{{env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

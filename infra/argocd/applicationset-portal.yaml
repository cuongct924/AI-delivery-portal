# Replaces portal-app.yaml — same pattern as applicationset-orchestration-api.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: portal
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            project: platform
          - env: staging
            project: platform
          - env: prod
            project: platform
  template:
    metadata:
      name: "portal-{{env}}"
    spec:
      project: "{{project}}"
      source:
        repoURL: https://github.com/cuongct924/AI-delivery-portal.git
        targetRevision: main
        path: infra/helm-charts/portal
        helm:
          valueFiles:
            - ../../environments/{{env}}/portal/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: "ai-delivery-portal-{{env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

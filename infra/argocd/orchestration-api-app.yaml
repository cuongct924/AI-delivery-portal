# Additive to `docker compose up -d`, not a replacement — this is the
# GitOps/production-like verification path; local dev still uses docker-compose.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orchestration-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cuongct924/AI-delivery-portal.git
    targetRevision: main
    path: infra/helm-charts/orchestration-api
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

# AppProject = [môi trường] + [tenant], theo đúng công thức mentor đề
# xuất — cô lập hoàn toàn quyền hạn: tenant "mlops-team" chỉ được sync vào
# đúng 1 namespace (prod x mlops-team), không đụng được tenant kia hay
# môi trường khác dù cùng tenant.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod-mlops-team
  namespace: argocd
spec:
  description: >
    mlops-team's inference-services, prod only.
  sourceRepos:
    - https://github.com/cuongct924/AI-delivery-portal.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ai-delivery-portal-prod-mlops-team
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # ArgoCD OIDC/SSO against Keycloak chưa được cấu hình/verify — roles
  # block này chưa có tác dụng thật cho tới khi xác minh (xem
  # infra/argocd/README.md và infra/kargo/README.md).
  roles:
    - name: deployers
      description: mlops-team — sync rights to prod only
      policies:
        - p, proj:prod-mlops-team:deployers, applications, sync, prod-mlops-team/*, allow
      groups:
        - mlops-team

# "Cách 2" — 1 ApplicationSet cho mỗi môi trường, quét qua thư mục từng
# tenant trong đúng môi trường đó (`infra/environments/prod/inference-services/*`)
# để tự sinh 1 Application/tenant, gán vào đúng AppProject `prod-{tenant}`
# tương ứng (appproject-prod-mlops-team.yaml, appproject-prod-llmops-team.yaml).
# Dùng `git` directory generator thật (không phải `list` viết tay như
# applicationset-orchestration-api.yaml/-portal.yaml) — ở đây project name
# suy ra thuần từ `{{path.basename}}` (tên thư mục tenant) nên không còn
# vướng hạn chế "git generator không gán project theo điều kiện" như
# ApplicationSet gộp nhiều môi trường trước đó.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: inference-services-prod
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/cuongct924/AI-delivery-portal.git
        revision: main
        directories:
          - path: infra/environments/prod/inference-services/*
  template:
    metadata:
      name: "inference-services-prod-{{path.basename}}"
    spec:
      project: "prod-{{path.basename}}"
      source:
        repoURL: https://github.com/cuongct924/AI-delivery-portal.git
        targetRevision: main
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "ai-delivery-portal-prod-{{path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

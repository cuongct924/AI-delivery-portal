# Golden Path #2's GitOps sync target — infra/inference-services/ is
# already flat, rendered YAML, so a plain `directory` source is enough.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-services
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cuongct924/AI-delivery-portal.git
    targetRevision: main
    path: infra/inference-services
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true  # a file deleted from git removes the matching resource too
      selfHeal: true  # manual kubectl edits get reverted back to git
    syncOptions:
      - CreateNamespace=false

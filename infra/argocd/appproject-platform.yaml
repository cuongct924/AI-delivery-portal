# The platform's own services (orchestration-api, portal) in every
# environment — not multi-tenant resources, so unlike inference-services
# they don't get a per-tenant AppProject split (see
# appproject-{env}-{tenant}.yaml for that).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: >
    orchestration-api/portal, all environments. platform-team only.
  sourceRepos:
    - https://github.com/cuongct924/AI-delivery-portal.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ai-delivery-portal-dev
    - server: https://kubernetes.default.svc
      namespace: ai-delivery-portal-staging
    - server: https://kubernetes.default.svc
      namespace: ai-delivery-portal-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # ArgoCD OIDC/SSO against Keycloak is not yet wired up — this `roles`
  # block is aspirational until that's verified (see infra/kargo/README.md's
  # equivalent caveat for Kargo's own auth).
  roles:
    - name: operators
      description: platform-team only
      policies:
        - p, proj:platform:operators, applications, sync, platform/*, allow
      groups:
        - platform-team

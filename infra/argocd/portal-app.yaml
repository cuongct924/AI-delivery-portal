# Additive to `yarn start`, not a replacement — see orchestration-api-app.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cuongct924/AI-delivery-portal.git
    targetRevision: main
    path: infra/helm-charts/portal
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-delivery-portal
nodes:
  - role: control-plane
    extraPortMappings:
      # KServe/Knative ingress will need this once installed.
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      # Argo Server REST API, exposed via a fixed NodePort (see
      # scripts/setup-k8s-local.sh) — chosen over `kubectl port-forward` so
      # localhost:2746 stays reachable across reboots/terminal restarts
      # without a background process to babysit.
      - containerPort: 32746
        hostPort: 2746
        protocol: TCP
      # ArgoCD server REST API/UI — same fixed-NodePort reasoning as Argo
      # Workflows above (see scripts/setup-kserve-argocd-local.sh).
      - containerPort: 32748
        hostPort: 2748
        protocol: TCP
      # Portal Backstage (infra/helm-charts/portal), exposed via NodePort —
      # 3000/3001 are already taken on the host (Backstage dev server /
      # Grafana), hence 3002. orchestration-api needs no host port — only
      # Portal calls it, over the in-cluster ClusterIP Service.
      - containerPort: 32749
        hostPort: 3002
        protocol: TCP
    extraMounts:
      # Exposes the DVC-pulled dataset to training pods via hostPath, so
      # ephemeral train-step containers can read it without embedding
      # S3/DVC-pull logic (see infra/argo-workflows/README.md).
      - hostPath: ../../data
        containerPath: /mnt/data
        readOnly: true

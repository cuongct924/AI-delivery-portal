kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ai-delivery-portal
nodes:
  - role: control-plane
    extraPortMappings:
      # KServe/Knative ingress will need this once installed.
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      # Argo Server REST API — fixed NodePort avoids babysitting a
      # port-forward process (see scripts/setup-k8s-local.sh).
      - containerPort: 32746
        hostPort: 2746
        protocol: TCP
      # ArgoCD server REST API/UI — same fixed-NodePort reasoning as above.
      - containerPort: 32748
        hostPort: 2748
        protocol: TCP
      # Portal — 3002 since 3000/3001 are already taken (Backstage/Grafana).
      - containerPort: 32749
        hostPort: 3002
        protocol: TCP
    extraMounts:
      # Exposes the DVC-pulled dataset to training pods via hostPath.
      - hostPath: ../../data
        containerPath: /mnt/data
        readOnly: true

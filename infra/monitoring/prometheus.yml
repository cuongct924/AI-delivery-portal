global:
  scrape_interval: 15s

scrape_configs:
  - job_name: orchestration-api
    metrics_path: /metrics
    static_configs:
      - targets: ['orchestration-api:8000']

  # Not a matter of KServe/BentoML exposing /metrics (they already do) — this
  # docker-compose Prometheus container and the local `kind` cluster
  # (infra/k8s-local-cluster/kind-config.yaml) sit on separate Docker
  # networks with no bridge between them. kind-config.yaml's
  # extraPortMappings only cover Knative/Kourier ingress, Argo, ArgoCD, and
  # Backstage — nothing for a KServe predictor's metrics port. Needs a real
  # network bridge (or running Prometheus inside the cluster) before this
  # target can resolve at all.
  # - job_name: kserve-inference
  #   static_configs:
  #     - targets: ['<inference-service>:8080']

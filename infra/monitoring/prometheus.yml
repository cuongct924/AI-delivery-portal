global:
  scrape_interval: 15s

scrape_configs:
  - job_name: orchestration-api
    metrics_path: /metrics
    static_configs:
      - targets: ['orchestration-api:8000']

  # Disabled: docker-compose's Prometheus and the local `kind` cluster sit
  # on separate Docker networks with no bridge — needs one before this

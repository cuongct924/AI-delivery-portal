apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: monitor-drift-golden-path
  namespace: default
spec:
  entrypoint: monitor-drift
  # Same least-privilege ServiceAccount as every other Golden Path — no
  # new cluster-level permissions for monitoring.
  serviceAccountName: train-register-workflow
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  volumes:
    - name: dataset
      hostPath:
        path: /mnt/data
        type: Directory
  arguments:
    parameters:
      - name: model-name
      - name: model-version
      - name: reference-data-uri
      - name: production-data-uri
      - name: drift-threshold
        value: "0.5"
      - name: on-drift-detected
        value: alert-only
      # Only required when on-drift-detected=auto-retrain — the exact
      # JSON body Dev would have POSTed to /trigger-training by hand.
      - name: retrain-request-json
        value: ""
  templates:
    - name: monitor-drift
      # CronWorkflow instantiates this directly — 1 step, no DAG wrapper.
      inputs:
        parameters:
          - name: model-name
          - name: model-version
          - name: reference-data-uri
          - name: production-data-uri
          - name: drift-threshold
          - name: on-drift-detected
          - name: retrain-request-json
      container:
        # Same image as every other Golden Path — monitor_drift.py is 1
        # more *.py file the Dockerfile already copies in.
        image: training-image:local
        imagePullPolicy: IfNotPresent
        command: [python, monitor_drift.py]
        env:
          - name: MODEL_NAME
            value: '{{inputs.parameters.model-name}}'
          - name: MODEL_VERSION
            value: '{{inputs.parameters.model-version}}'
          - name: REFERENCE_DATA_URI
            value: '{{inputs.parameters.reference-data-uri}}'
          - name: PRODUCTION_DATA_URI
            value: '{{inputs.parameters.production-data-uri}}'
          - name: DRIFT_THRESHOLD
            value: '{{inputs.parameters.drift-threshold}}'
          - name: ON_DRIFT_DETECTED
            value: '{{inputs.parameters.on-drift-detected}}'
          - name: RETRAIN_REQUEST_JSON
            value: '{{inputs.parameters.retrain-request-json}}'
          - name: MLFLOW_TRACKING_URI
            value: http://host.docker.internal:5000
          - name: ORCHESTRATION_API_URL
            value: http://host.docker.internal:8000
        volumeMounts:
          - name: dataset
            mountPath: /mnt/data
            readOnly: true

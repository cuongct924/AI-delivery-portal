# DRAFT — see README.md "Trạng thái xác minh" before relying on this file.
#
# Confirmed from docs.kubara.io/latest-stable/1_getting_started/quick_start/:
#   - the file is named `config.yaml`, produced by `kubara init --local`
#   - it "defines your cluster profile and the services Argo CD will manage
#     for that cluster"
# NOT confirmed (docs.kubara.io's field-level schema wasn't reachable via
# fetch in this session): the exact key names below for declaring a
# cluster profile / pinned capability versions. Treat this as an intent
# sketch to reconcile against the real output of `kubara init --local`,
# not a verified schema.

clusterProfile: ai-delivery-portal-local

# Platform services — not multi-tenant, 1 namespace per environment.
environments:
  - name: dev
    namespace: ai-delivery-portal-dev
  - name: staging
    namespace: ai-delivery-portal-staging
  - name: prod
    namespace: ai-delivery-portal-prod

# inference-services is multi-tenant — 1 namespace per (environment,
# tenant) pair, matching infra/argocd/appproject-<env>-<tenant>.yaml.
tenants:
  - mlops-team
  - llmops-team
tenantEnvironments:
  - namespace: ai-delivery-portal-dev-mlops-team
  - namespace: ai-delivery-portal-dev-llmops-team
  - namespace: ai-delivery-portal-staging-mlops-team
  - namespace: ai-delivery-portal-staging-llmops-team
  - namespace: ai-delivery-portal-prod-mlops-team
  - namespace: ai-delivery-portal-prod-llmops-team

# Services ArgoCD manages per environment — versions pinned once here
# instead of duplicated by hand across N near-identical ApplicationSets.
services:
  - name: orchestration-api
    chart: ../helm-charts/orchestration-api
    version: local
    scope: per-environment
  - name: portal
    chart: ../helm-charts/portal
    version: local
    scope: per-environment
  - name: inference-services
    # Not a Helm chart — flat rendered InferenceService YAML per
    # infra/environments/<env>/inference-services/<tenant>/, written by
    # orchestration-api (dev only) and promoted by Kargo, per tenant,
    # into staging/prod.
    source: directory
    scope: per-tenant
